# Published result sets: the files run.py report reads.
# results/ keeps every run; publishing is listing a file here. Each set must
# share one commit, machine and kernel command line.

# Measured as episodes classified by the branch predictor's state (note 009,
# amendment of 2026-10-22), bench mode with every idle state on the reserved
# CPUs and perf_event_paranoid 2. Replaces the 2026-10-21 set
# (codec-dev-lnx01-20261021T175022Z, T190515Z, T202010Z: note 002, C1 cap,
# one figure per case, which pooled the two states), kept in results/.
# Withheld (S8): scalar framing of ExecutionReport and Heartbeat, whose p50
# moved 6.8% and 3.4% across the three runs in one predictor state (note 009,
# Review 2026-10-22).
[codec]
note = "009"
runs = ["codec-dev-lnx01-20261022T192017Z.json",
        "codec-dev-lnx01-20261022T192443Z.json",
        "codec-dev-lnx01-20261022T192912Z.json"]
withheld = ["frame_scalar_er", "frame_scalar_hb"]

# Note 004: the journal's cost per durability strategy, pre-filled files (D5),
# three runs back to back in one bench-mode session.
[store]
note = "004"
runs = ["store-dev-lnx01-20261023T003324Z.json",
        "store-dev-lnx01-20261023T003610Z.json",
        "store-dev-lnx01-20261023T003856Z.json"]

# Note 005: TCP round trip and the order path, three paths (loopback; the
# 10 Gb card, Cat6, far end in a namespace; the card with kernel busy polling
# at 50 us), three runs each, one bench-mode session.
[net]
note = "005"
runs = ["net-dev-lnx01-20261023T160514Z.json",
        "net-dev-lnx01-20261023T160612Z.json",
        "net-dev-lnx01-20261023T160709Z.json",
        "net-dev-lnx01-20261023T160807Z.json",
        "net-dev-lnx01-20261023T160914Z.json",
        "net-dev-lnx01-20261023T161022Z.json",
        "net-dev-lnx01-20261023T161130Z.json",
        "net-dev-lnx01-20261023T161235Z.json",
        "net-dev-lnx01-20261023T161340Z.json"]
